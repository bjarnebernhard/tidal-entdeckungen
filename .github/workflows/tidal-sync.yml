name: Tidal-Playlist aktualisieren

on:
  push:
    paths:
      - "songs/latest.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tidalapi
      # Tidal-Login aus dem Cache holen (von der Action „Tidal-Login“ angelegt)
      - uses: actions/cache/restore@v4
        with:
          path: .tidal
          key: tidal-token-none
          restore-keys: tidal-token-
      - run: python tidal_sync.py
        env:
          TIDAL_REFRESH_TOKEN: ${{ secrets.TIDAL_REFRESH_TOKEN }}
          TOKEN_FILE: .tidal/token.json
          PLAYLIST_NAME: "Tägliche Entdeckungen"
          MODE: "replace"
      # Playlist „Rotation“ als Geschmacksvorlage nach songs/rotation.txt exportieren
      - run: python tidal_export.py
        if: always()
        continue-on-error: true
        env:
          TIDAL_REFRESH_TOKEN: ${{ secrets.TIDAL_REFRESH_TOKEN }}
          TOKEN_FILE: .tidal/token.json
      - name: Export committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add songs/rotation.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Rotation-Export" && git pull --rebase && git push)
      # Login neu speichern, damit der Cache nicht nach 7 Tagen verfällt
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.tidal/token.json') != ''
        with:
          path: .tidal
          key: tidal-token-${{ github.run_id }}
